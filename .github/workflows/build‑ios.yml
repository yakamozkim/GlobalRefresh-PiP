name: Build GlobalRefresh-PiP Unsigned IPA

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 打印仓库根目录全部文件，看工程在哪
      - name: List repo root files
        run: ls -la
        shell: bash

      # 打印pip_oc文件夹内部全部文件
      - name: List pip_oc files
        run: ls -la pip_oc
        shell: bash
