name: Build GlobalRefresh-PiP Unsigned IPA

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Enter pip_oc project folder
        run: cd pip_oc
        shell: bash

      - name: Create shared scheme folder
        run: mkdir -p GlobalRefresh-PiP.xcodeproj/xcshareddata/xcschemes
        shell: bash

      - name: Write scheme file
        run: |
          cat > GlobalRefresh-PiP.xcodeproj/xcshareddata/xcschemes/GlobalRefresh-PiP.xcscheme <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<Scheme
   LastUpgradeVersion = "1500"
   version = "1.3">
   <BuildAction
      parallelizeBuildables = "YES"
      buildImplicitDependencies = "YES">
      <BuildActionEntries>
         <BuildActionEntry
            buildForTesting = "YES"
            buildForRunning = "YES"
            buildForProfiling = "YES"
            buildForArchiving = "YES"
            buildForAnalyzing = "YES">
            <BuildableReference
               BuildableIdentifier = "primary"
               BlueprintName = "GlobalRefresh-PiP"
               BuildableName = "GlobalRefresh-PiP.app"
               ReferencedContainer = "container:GlobalRefresh-PiP.xcodeproj">
            </BuildableReference>
         </BuildActionEntry>
      </BuildActionEntries>
   </BuildAction>
   <TestAction
      buildConfiguration = "Release"
      selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
      selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
      shouldUseLaunchSchemeArgsEnv = "YES">
      <Testables></Testables>
   </TestAction>
   <LaunchAction
      buildConfiguration = "Release"
      selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
      selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
      launchStyle = "0"
      useCustomWorkingDirectory = "NO"
      ignoresPersistentStateOnLaunch = "NO"
      debugDocumentVersioning = "YES"
      debugServiceExtension = "internal"
      allowLocationSimulation = "YES">
      <BuildableProductRunnable runnableDebuggingMode = "0">
         <BuildableReference
            BuildableIdentifier = "primary"
            BlueprintName = "GlobalRefresh-PiP"
            BuildableName = "GlobalRefresh-PiP.app"
            ReferencedContainer = "container:GlobalRefresh-PiP.xcodeproj">
         </BuildableReference>
      </BuildableProductRunnable>
   </LaunchAction>
   <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer = "YES"/>
</Scheme>
EOF
        shell: bash

      - name: List project files
        run: ls -la GlobalRefresh-PiP.xcodeproj/xcshareddata/xcschemes
        shell: bash

      - name: Show available schemes
        run: xcodebuild -list
        shell: bash

      - name: Xcode clean archive no-sign
        run: |
          xcodebuild clean archive \
            -project GlobalRefresh-PiP.xcodeproj \
            -scheme "GlobalRefresh-PiP" \
            -configuration Release \
            -archivePath ./build/GlobalRefresh-PiP.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        shell: bash

      - name: Export unsigned IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ./build/GlobalRefresh-PiP.xcarchive \
            -exportPath ./output \
            -exportOptionsPlist ./exportOptions.plist
        shell: bash

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalRefresh-PiP-Unsigned-IPA
          path: pip_oc/output/*.ipa
          retention-days: 14
          if-no-files-found: warn
